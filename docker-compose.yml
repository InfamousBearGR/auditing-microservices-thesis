services:
  # 1. Source Database
  mainDb:
    image: postgres:15-alpine
    container_name: mainDb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=mainDb
    command: [ "postgres", "-c", "wal_level=logical" ]
    volumes:
      - ./mainDb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d mainDb" ]  # TCP: not ready while init scripts run
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Kafka Cluster (KRaft mode - 3 Brokers)
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      # Event topics are auto-created on first publish; replicate them on all 3
      # brokers (same as the internal topics) so a single broker loss costs no data.
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_LOG_SEGMENT_BYTES=536870912
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-2
    ports:
      - "9094:9092"
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      # Event topics are auto-created on first publish; replicate them on all 3
      # brokers (same as the internal topics) so a single broker loss costs no data.
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_LOG_SEGMENT_BYTES=536870912
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  kafka-3:
    image: apache/kafka:latest
    container_name: kafka-3
    ports:
      - "9095:9092"
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      # Event topics are auto-created on first publish; replicate them on all 3
      # brokers (same as the internal topics) so a single broker loss costs no data.
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_LOG_SEGMENT_BYTES=536870912
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  # 3. Kafka UI (kraft-ui)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka-1:
        condition: service_healthy

  # 4. Debezium Connect
  debezium:
    image: quay.io/debezium/connect:latest
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    depends_on:
      kafka-1:
        condition: service_healthy
      mainDb:
        condition: service_healthy

  # 5. Connector Registration Script (Ephemeral)
  debezium-setup:
    image: curlimages/curl:latest
    environment:
      # Benchmark sets SNAPSHOT_MODE=never (stream only post-slot changes, no seed
      # snapshot) so cdc audit volume + lag reflect the workload only. Default initial.
      - SNAPSHOT_MODE=${SNAPSHOT_MODE:-initial}
    volumes:
      - ./debezium/register-connector.sh:/register-connector.sh
    command: /bin/sh /register-connector.sh
    depends_on:
      - debezium

  # 6. TimescaleDB (Audit Store)
  auditDb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=auditdb
    volumes:
      - ./auditDb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d auditdb" ]  # TCP: not ready while init scripts run
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. Audit Consumer (Java 21)
  audit-consumer:
    build:
      context: ./audit-consumer
      dockerfile: Dockerfile
    container_name: audit-consumer
    environment:
      - GROOVY_PROFILES_ACTIVE=prod
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      auditDb:
        condition: service_healthy
    restart: unless-stopped

  # 8. Spring WebFlux SSE Bridge
  sse-bridge:
    build:
      context: ./sse-bridge
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      auditDb:
        condition: service_healthy

  # 9. Go History API
  history-api:
    build:
      context: ./history-api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ENV_FILE=.env.prod
    depends_on:
      auditDb:
        condition: service_healthy

  # 10. Business Registry API (Spring Boot)
  business-registry-api:
    build:
      context: ./business-registry/api
      dockerfile: Dockerfile
    container_name: business-registry-api
    ports:
      - "8084:8084"
    environment:
      # Overridable for the audit-method benchmark (e.g. BR_API_PROFILES=prod,envers).
      - SPRING_PROFILES_ACTIVE=${BR_API_PROFILES:-prod}
    depends_on:
      mainDb:
        condition: service_healthy
    restart: unless-stopped

  # 11. Business Registry Client (React/Vite)
  business-registry-client:
    build:
      context: ./business-registry/client
      dockerfile: Dockerfile
    container_name: business-registry-client
    ports:
      - "5000:80"
    depends_on:
      - business-registry-api
    restart: unless-stopped

