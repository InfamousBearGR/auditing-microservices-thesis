services:
  # 1. Source Database
  mainDb:
    image: postgres:15-alpine
    container_name: mainDb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=mainDb
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./mainDb/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Kafka (KRaft mode - No Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  # 3. Debezium Connect
  debezium:
    image: quay.io/debezium/connect:latest
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    depends_on:
      - kafka
      - mainDb

  # 4. Connector Registration Script (Ephemeral)
  debezium-setup:
    image: curlimages/curl:latest
    volumes:
      - ./debezium/register-connector.sh:/register-connector.sh
    command: /bin/sh /register-connector.sh
    depends_on:
      - debezium

  # 5. TimescaleDB (Audit Store)
  auditDb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=auditdb
    volumes:
      - ./auditDb/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 6. Redpanda Connect (ETL)
  auditConsumer:
    image: redpandadata/connect:latest
    container_name: auditConsumer
    volumes:
      - ./auditConsumer/config.yaml:/connect.yaml
    command: ["-c", "/connect.yaml"]
    depends_on:
      - kafka
      - auditDb

  # 7. Spring WebFlux SSE Bridge
  sse-bridge:
    build: ./sse-bridge
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    develop:
      watch:
        - action: rebuild
          path: ./sse-bridge/src
        - action: rebuild
          path: ./sse-bridge/build.gradle.kts

  # 8. Go History API
  history-api:
    build: ./history-api
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=auditDb
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=auditdb
    depends_on:
      - auditDb
    develop:
      watch:
        - action: rebuild
          path: ./history-api
          ignore:
            - ./history-api/Dockerfile
        - action: rebuild
          path: ./history-api/go.mod
        - action: rebuild
          path: ./history-api/go.sum
