# Hibernate Envers audit scenario (thesis comparison).
#
# Activate ALONGSIDE a base profile, base profile FIRST so these keys win:
#   SPRING_PROFILES_ACTIVE=prod,envers   (or dev,envers)
#
# Turns on the Envers integrator so @Audited entities write revision rows into
# <table>_AUD tables + a shared REVINFO (with custom changed_by_user_id /
# change_reason columns populated by AuditRevisionListener). These rows commit
# inside the mutation's own transaction => synchronous, ~0 audit lag.
spring.jpa.properties.hibernate.integration.envers.enabled=true

# Let Envers create its _AUD + REVINFO tables (and revinfo sequence) on startup.
# The base business tables already exist from mainDb/init.sql; 'update' only adds
# the missing Envers schema. (Base profiles use 'validate'.)
spring.jpa.hibernate.ddl-auto=update

# Default suffix/table names (documented here for the thesis write-up):
#   audit table suffix = _AUD, revision field = REV, revision-type field = REVTYPE
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE
