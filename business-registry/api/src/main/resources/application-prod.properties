# Production Environment Configuration
# This file is automatically loaded when SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=8084

# Database Configuration (JPA) - Production
spring.datasource.url=jdbc:postgresql://mainDb:5432/mainDb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Hibernate Envers OFF by default (thesis: enabled only under the 'envers' profile).
# When off, @Audited annotations are ignored and no *_AUD/REVINFO tables are expected.
spring.jpa.properties.hibernate.integration.envers.enabled=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration - Less verbose for production
logging.level.com.business.registry=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# DevTools Configuration - Disabled for production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Production-specific settings
spring.jackson.serialization.indent_output=false

# Performance settings
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

