# Development Environment Configuration
# This file is automatically loaded when SPRING_PROFILES_ACTIVE=dev

# Server Configuration
server.port=8084

# Database Configuration (JPA) - Local development
spring.datasource.url=jdbc:postgresql://localhost:5432/mainDb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Hibernate Envers OFF by default (thesis: enabled only under the 'envers' profile).
# When off, @Audited annotations are ignored and no *_AUD/REVINFO tables are expected.
spring.jpa.properties.hibernate.integration.envers.enabled=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration - More verbose for development
logging.level.com.business.registry=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DevTools Configuration - Enabled for hot reload
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/groovy
spring.devtools.livereload.enabled=false
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400
logging.level.org.springframework.boot.devtools=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Development-specific settings
spring.jackson.serialization.indent_output=true

# CORS Configuration - Allow requests from the Vite dev server
cors.allowed-origins=http://localhost:5000

