services:
  # 1. Source Database
  mainDb:
    image: postgres:15-alpine
    container_name: mainDb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=mainDb
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./mainDb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mainDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Kafka (KRaft mode - No Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 5

  # 3. Debezium Connect
  debezium:
    image: quay.io/debezium/connect:latest
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      mainDb:
        condition: service_healthy

  # 4. Connector Registration Script (Ephemeral)
  debezium-setup:
    image: curlimages/curl:latest
    volumes:
      - ./debezium/register-connector.sh:/register-connector.sh
    command: /bin/sh /register-connector.sh
    depends_on:
      - debezium

  # 5. TimescaleDB (Audit Store)
  auditDb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=auditdb
    volumes:
      - ./auditDb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auditdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Audit Consumer (Java 21)
  audit-consumer:
    build:
      context: ./audit-consumer
      dockerfile: Dockerfile.dev
    container_name: audit-consumer
    ports:
      - "5005:5005"
    command: ./gradlew run
    depends_on:
      kafka:
        condition: service_healthy
      auditDb:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./audit-consumer/src
          target: /app/src

  # 7. Spring WebFlux SSE Bridge
  sse-bridge:
    build:
      context: ./sse-bridge
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER=kafka:9092
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    depends_on:
      kafka:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./sse-bridge/src
          target: /app/src
        - action: rebuild
          path: ./sse-bridge/build.gradle

  # 8. Go History API
  history-api:
    build:
      context: ./history-api
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=auditDb
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=auditdb
    depends_on:
      auditDb:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./history-api
          ignore:
            - ./history-api/Dockerfile
            - ./history-api/Dockerfile.dev
            - ./history-api/tmp
          target: /app
