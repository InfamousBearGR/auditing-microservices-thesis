input:
  kafka:
    addresses: [ "kafka:9092" ]
    topics: [ "server.public.company" ]
    consumer_group: "audit_archiver"

pipeline:
  processors:
    # Debezium messages have a complex structure. We want the 'after' or 'before' payload.
    - mapping: |
        root.changes = this.payload.after
        root.changed_at = now()

output:
  sql_insert:
    driver: postgres
    dsn: postgres://admin:admin@auditDb:5432/auditdb?sslmode=disable
    table: company_audit
    columns:
      - changes
      - changed_at
    args_mapping: |
      root = [ this.changes.format_json(), this.changed_at ]
