basePath: /
definitions:
  models.AuditEntry:
    properties:
      after:
        description: Can be null for DELETE operations
        type: object
      before:
        description: Can be null for CREATE operations
        type: object
      change_id:
        description: Unique identifier for the change, useful for tracing related
          changes
        type: string
      change_reason:
        description: Field to capture the reason for the change
        type: string
      changed_at:
        description: Date of change in ISO 8601 format
        type: string
      id:
        description: Identifier for the audit entry
        type: integer
      operation_type:
        description: e.g., "INSERT", "UPDATE", "DELETE"
        type: string
      parent_id:
        description: ID of the topic record that was changed
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  description: Get audit logs for company changes from auditDb
  title: Company History API
  version: "1.0"
paths:
  /exportHistoryByChangeIdRange:
    get:
      consumes:
      - application/json
      description: Downloads audit entries for a change ID range as a Parquet file
        (optimized for high-volume data)
      parameters:
      - description: Starting change_id (inclusive)
        example: 1
        in: query
        name: changeIdFrom
        required: true
        type: integer
      - description: Ending change_id (inclusive)
        example: 100
        in: query
        name: changeIdTo
        required: true
        type: integer
      - description: Topic name
        enum:
        - company
        - person
        - legal_entity
        - member
        - company_stocks
        - company_capital
        example: company
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Parquet file download
          schema:
            type: file
        "400":
          description: changeIdFrom parameter required
          schema:
            type: string
        "401":
          description: Unauthorized - Invalid API key
          schema:
            type: string
        "403":
          description: Forbidden - Access denied to topic
          schema:
            type: string
        "404":
          description: No audit entries found
          schema:
            type: string
        "500":
          description: Error generating Parquet file
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Export audit history as Parquet file by change ID range
      tags:
      - export
  /exportHistoryByDateRange:
    get:
      consumes:
      - application/json
      description: Downloads audit entries for a date range as a Parquet file (optimized
        for high-volume data)
      parameters:
      - description: Date in YYYY-MM-DD format
        example: "2026-02-10"
        in: query
        name: dateFrom
        required: true
        type: string
      - description: Date in YYYY-MM-DD format
        example: "2026-02-10"
        in: query
        name: dateTo
        required: true
        type: string
      - description: Topic name
        enum:
        - company
        - person
        - legal_entity
        - member
        - company_stocks
        - company_capital
        example: company
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Parquet file download
          schema:
            type: file
        "400":
          description: dateFrom parameter required
          schema:
            type: string
        "401":
          description: Unauthorized - Invalid API key
          schema:
            type: string
        "403":
          description: Forbidden - Access denied to topic
          schema:
            type: string
        "404":
          description: No audit entries found
          schema:
            type: string
        "500":
          description: Error generating Parquet file
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Export audit history as Parquet file by date range
      tags:
      - export
  /getHistoryByChangeIdRange:
    get:
      consumes:
      - application/json
      description: Retrieves all audit entries within a specific change_id range
      parameters:
      - description: Starting change_id (inclusive)
        example: 1
        in: query
        name: changeIdFrom
        required: true
        type: integer
      - description: Ending change_id (inclusive)
        example: 100
        in: query
        name: changeIdTo
        required: true
        type: integer
      - description: Topic name
        enum:
        - company
        - person
        - legal_entity
        - member
        - company_stocks
        - company_capital
        example: company
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved audit entries
          schema:
            items:
              $ref: '#/definitions/models.AuditEntry'
            type: array
        "400":
          description: changeIdFrom parameter required or invalid
          schema:
            type: string
        "401":
          description: Unauthorized - Invalid API key
          schema:
            type: string
        "403":
          description: Forbidden - Access denied to topic
          schema:
            type: string
        "404":
          description: No audit entries found for the specified change_id range
          schema:
            type: string
        "500":
          description: Error fetching audit entries
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get audit history for a specific change_id range
      tags:
      - history
  /getHistoryByDateRange:
    get:
      consumes:
      - application/json
      description: Retrieves all audit entries for company changes on a specific date
      parameters:
      - description: Date in YYYY-MM-DD format
        example: "2026-02-10"
        in: query
        name: dateFrom
        required: true
        type: string
      - description: Date in YYYY-MM-DD format
        example: "2026-02-10"
        in: query
        name: dateTo
        required: true
        type: string
      - description: Topic name
        enum:
        - company
        - person
        - legal_entity
        - member
        - company_stocks
        - company_capital
        example: company
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved audit entries
          schema:
            items:
              $ref: '#/definitions/models.AuditEntry'
            type: array
        "400":
          description: dateFrom parameter required
          schema:
            type: string
        "401":
          description: Unauthorized - Invalid API key
          schema:
            type: string
        "403":
          description: Forbidden - Access denied to topic
          schema:
            type: string
        "404":
          description: No audit entries found for the specified date range
          schema:
            type: string
        "500":
          description: Error fetching audit entries
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get audit history for a specific date
      tags:
      - history
securityDefinitions:
  ApiKeyAuth:
    description: 'Enter your API key in the format: Bearer <api_key> (an X-API-Key: <api_key> header is accepted too)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
