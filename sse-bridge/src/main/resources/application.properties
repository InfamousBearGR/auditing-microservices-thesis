# Application Configuration
spring.application.name=sse-bridge

# Server Configuration
server.port=8080

# Database Configuration (R2DBC)
spring.r2dbc.url=r2dbc:postgresql://localhost:5433/auditdb
spring.r2dbc.username=admin
spring.r2dbc.password=admin

# Logging Configuration
logging.config=classpath:logback-spring.xml

# Custom logging levels can be set here as well
# logging.level.sseBridge=DEBUG
# logging.level.org.springframework=INFO
# logging.level.org.apache.kafka=WARN

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/groovy
# Disable live reload (not needed for backend)
spring.devtools.livereload.enabled=false
# Use polling for file changes (better for containers/Docker volumes)
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400
# Log level to see DevTools activity
logging.level.org.springframework.boot.devtools=DEBUG

#kafka config
kafka.bootstrap.servers=localhost:9094
kafka.client.event.topic=server.public.*
kafka.client.id=sse-bridge
kafka.session.timeout.ms=30000
kafka.default.api.timeout.ms=30000
kafka.request.timeout.ms=30000
kafka.reconnect.backoff.max.ms=30000
kafka.reconnect.backoff.ms=1000
kafka.retry.backoff.ms=1000