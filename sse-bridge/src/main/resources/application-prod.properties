# Production Environment Configuration
# This file is automatically loaded when SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=8080

# Database Configuration (R2DBC) - Production
spring.r2dbc.url=r2dbc:postgresql://auditDb:5432/auditdb
spring.r2dbc.username=admin
spring.r2dbc.password=admin
# Note: In real production, use environment variables or secrets management for credentials

# Logging Configuration - Less verbose for production
logging.level.sseBridge=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.r2dbc=WARN

# DevTools Configuration - Disabled for production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Kafka Configuration - Production
kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
kafka.client.event.topic=server.public.*
kafka.client.id=sse-bridge-prod
kafka.session.timeout.ms=45000
kafka.default.api.timeout.ms=45000
kafka.request.timeout.ms=45000
kafka.reconnect.backoff.max.ms=30000
kafka.reconnect.backoff.ms=2000
kafka.retry.backoff.ms=2000
kafka.group=sse-bridge-group

# Production-specific settings
spring.jackson.serialization.indent_output=false

# Performance and reliability settings
server.netty.connection-timeout=30s
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m

